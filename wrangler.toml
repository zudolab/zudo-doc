# Cloudflare Workers Static Assets configuration
# Migrated from Cloudflare Pages — see zudolab/zudo-doc#1691

name = "zudo-doc"
main = "./dist/_worker.js"

compatibility_date = "2024-12-01"
# nodejs_compat is required by the CF adapter bundle at dist/_worker.js,
# which imports node:async_hooks (AsyncLocalStorage). Without this flag
# wrangler 4.x refuses to load the worker even when dist/_worker.js exists.
compatibility_flags = ["nodejs_compat"]

# Top-level fields (MUST stay above the [assets] table — in TOML any key after
# a table header is scoped into that table; if these sit under [assets] wrangler
# warns "Unexpected fields found in assets field" and silently ignores them).
#
# preview_urls enables *.workers.dev version-preview URLs for staging/preview
# deploys (consumed by preview-deploy.yml / pr-checks.yml via
# `wrangler versions upload --preview-alias`).
preview_urls = true
workers_dev = false  # prevent serving on *.workers.dev prod route; previews use preview_urls above

# ---------------------------------------------------------------------------
# Static asset serving
#
# not_found_handling = "404-page" serves dist/404.html for unmatched GETs.
# It does NOT intercept POST requests (e.g. POST /api/ai-chat), because the
# asset layer is only consulted for GET/HEAD methods.
#
# run_worker_first = false means the asset layer is consulted before the
# worker script; the worker only runs when no matching asset is found.
#
# .assetsignore mechanism: during deploy-prep (Wave-2 CI workflows) a
# .assetsignore file is written into dist/ listing _worker.js and
# _zfb_inner.mjs so those files are excluded from the public asset
# directory and are not served as downloadable files. That file is
# generated by the deploy workflow — it is NOT committed to the repo.
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = false

# ---------------------------------------------------------------------------
# Custom domain routing
# ---------------------------------------------------------------------------
[[routes]]
pattern = "zudo-doc.takazudomodular.com"
custom_domain = true

# ---------------------------------------------------------------------------
# AI chat endpoint (pages/api/ai-chat.tsx)
#
# Required setup before deploying (see zudolab/zudo-doc#1691 prerequisites):
#
#   1. Create the KV namespace:
#        wrangler kv namespace create RATE_LIMIT
#      Then paste the returned `id` below.
#
#   2. Add the Anthropic API key as a secret:
#        wrangler secret put ANTHROPIC_API_KEY
#
#   3. Set DOCS_SITE_URL to your deployed docs site URL.
#
#   4. (Optional, non-breaking) Salt the IP hash with an HMAC secret:
#        wrangler secret put IP_HASH_SECRET
#      When set, client IPs are keyed with HMAC-SHA-256 instead of unsalted
#      SHA-256, defeating IPv4-enumeration reversal of stored hashes (#2038).
#      Absent → falls back to unsalted SHA-256 (identical to prior behaviour).
#      Setting/rotating it resets in-flight rate-limit buckets (60s) and breaks
#      audit-hash continuity for the current 7-day window — both acceptable.
# ---------------------------------------------------------------------------

[vars]
# DOCS_SITE_URL is used by the AI chat endpoint to fetch llms-full.txt context.
# Override per environment via `wrangler deploy --var DOCS_SITE_URL=<preview-url>`
# or via the Cloudflare dashboard to avoid preview deploys using production docs.
DOCS_SITE_URL = "https://zudo-doc.takazudomodular.com"
RATE_LIMIT_PER_MINUTE = "10"
RATE_LIMIT_PER_DAY = "100"

[[kv_namespaces]]
binding = "RATE_LIMIT"
# KV namespace id (not a secret — account-scoped identifier). Created via
# `wrangler kv namespace create RATE_LIMIT` per zudolab/zudo-doc#1691.
id = "19cd1f19d18d4d50b79db8198b3479b3"

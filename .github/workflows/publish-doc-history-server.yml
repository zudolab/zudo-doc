# Publish @zudo-doc/doc-history-server to npm.
#
# Trigger (two paths):
#   1. release: published — fires when a human publishes a GitHub Draft Release
#      whose tag matches the doc-history-server- prefix.
#   2. workflow_dispatch with dry_run: true — proves the token and safeguards
#      pass without touching npm.
#
# Tag prefix choice — `doc-history-server-X.Y.Z` (e.g. doc-history-server-0.1.0):
#   Both this workflow and publish-zudo-doc-v2.yml use prefixed tag namespaces
#   so a single tag fires exactly one publish workflow. The bare `v*` namespace
#   belongs to publish-create-zudo-doc.yml; this one and v2 use longer
#   prefixes for unambiguous disambiguation.
#
# Workflow_dispatch caveat:
#   When dispatching manually, choose a doc-history-server- prefixed tag as
#   the ref — Safeguard 1 rejects refs that don't match. Dispatching from
#   `main` will fail-fast with a clear message.
#
# NPM_TOKEN must be an Automation token (type: "Automation" in npmjs.com).
#
# OIDC provenance:
#   id-token: write is required so npm can request an OIDC identity token
#   and attach provenance metadata to the published package. The repo must
#   be public (zudolab/zudo-doc is public) for provenance to be recorded
#   in the npm transparency log.
#
# Build step IS required:
#   doc-history-server ships compiled dist/*.js + dist/*.d.ts (see
#   packages/doc-history-server/package.json `exports` pointing at dist/).
#   The package's `prepare` hook (tsup) already runs on `pnpm install`,
#   but we keep an explicit build step here for clarity and to survive
#   any future prepare-hook removal.

name: Publish doc-history-server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — verify auth and safeguards only; skip npm publish'
        type: boolean
        required: false
        default: false

# Least-privilege: read for checkout, id-token for OIDC provenance.
permissions:
  contents: read
  id-token: write

# Prevent concurrent publish runs for THIS package only. Distinct from
# publish-create-zudo-doc and publish-zudo-doc-v2 so the three release
# workflows can run in parallel.
concurrency:
  group: publish-doc-history-server
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout at the exact release tag ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # ── Safeguard 1/4: Tag must start with "doc-history-server-" ──────────
      - name: '[Safeguard 1/4] Reject non-doc-history-server-* release tags'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "Release tag: $TAG"
          if [[ "$TAG" != doc-history-server-* ]]; then
            echo "::error::Release tag '$TAG' does not start with 'doc-history-server-'."
            echo "::error::Only doc-history-server-prefixed version tags (e.g. doc-history-server-0.1.0) trigger this workflow."
            echo "::error::For workflow_dispatch dry runs, choose a doc-history-server-prefixed tag/ref."
            exit 1
          fi
          VERSION="${TAG#doc-history-server-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # ── Setup toolchain ────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-publish-dhs

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # ── Safeguard 2/4: package.json version must match the tag ─────────────
      - name: '[Safeguard 2/4] Assert package.json version matches tag'
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./packages/doc-history-server/package.json').version")
          echo "Tag version:     $VERSION"
          echo "package.json:    $PKG_VERSION"
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::packages/doc-history-server/package.json .version is '$PKG_VERSION' but tag is 'doc-history-server-$VERSION'."
            echo "::error::Bump the version with scripts/release-create-zudo-doc.sh before tagging."
            exit 1
          fi

      # ── Safeguard 3/4: Version must not already be published ───────────────
      - name: '[Safeguard 3/4] Assert version not yet published to npm'
        shell: bash
        run: |
          EXISTING=$(npm view "@zudo-doc/doc-history-server@$VERSION" version 2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            echo "::error::@zudo-doc/doc-history-server@$VERSION is already published on npm (found: $EXISTING)."
            echo "::error::npm publish is irreversible — aborting to prevent a duplicate-version error."
            exit 1
          fi
          echo "OK: @zudo-doc/doc-history-server@$VERSION does not yet exist on npm."

      # ── Install dependencies ───────────────────────────────────────────────
      # pnpm install auto-runs the package's `prepare` script (tsup), which
      # produces dist/. We keep an explicit build step below for defensive
      # clarity in case the prepare hook is ever removed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build (explicit, defensive) ───────────────────────────────────────
      - name: Build doc-history-server
        run: pnpm --filter @zudo-doc/doc-history-server build

      # ── Run tests ─────────────────────────────────────────────────────────
      - name: Test doc-history-server
        run: pnpm --filter @zudo-doc/doc-history-server test

      # ── Compute dist-tag ───────────────────────────────────────────────────
      - name: Compute npm dist-tag
        shell: bash
        run: |
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Dist tag: $DIST_TAG (version: $VERSION)"

      # ── Safeguard 4/4: Dry-run path ────────────────────────────────────────
      - name: '[Safeguard 4/4] Dry-run: verify auth then stop (skip real publish)'
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== DRY RUN MODE — npm publish will NOT be executed ==="
          echo ""
          echo "Verifying NPM_TOKEN authenticates against registry.npmjs.org..."
          npm whoami
          echo ""
          echo "Would publish:"
          echo "  Package : @zudo-doc/doc-history-server"
          echo "  Version : $VERSION"
          echo "  Dist-tag: $DIST_TAG"
          echo "  Flags   : --access public --provenance --no-git-checks"
          echo ""
          echo "Dry run complete. Remove dry_run input or set it to false to publish for real."

      # ── Real publish ───────────────────────────────────────────────────────
      # Uses `pnpm publish` (not `npm publish`) for consistency with the
      # other workspace publish workflows. --no-git-checks is required for
      # CI's detached-HEAD checkout.
      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @zudo-doc/doc-history-server@$VERSION with --tag $DIST_TAG..."
          pnpm --filter @zudo-doc/doc-history-server publish \
            --access public \
            --provenance \
            --no-git-checks \
            --tag "$DIST_TAG"
          echo "Published: https://www.npmjs.com/package/@zudo-doc/doc-history-server/v/$VERSION"

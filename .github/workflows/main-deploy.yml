# Production deployment workflow for the zudo-doc site.
#
# Triggered on every push to `main`. The pipeline:
#   1. Builds the static site (full clone — needed for SSG meta dates)
#   2. HTML validates the built dist/
#   3. Builds doc history JSONs (full clone, standalone server package)
#   4. Merges both build outputs and deploys to Cloudflare Workers
#   5. Sends IFTTT notification with deploy status
#
# zfb and zdtp are consumed directly from npm (see package.json). The zfb
# CLI's prebuilt Rust binary arrives via a platform-specific
# optionalDependency (@takazudo/zfb-linux-x64-gnu on these ubuntu runners),
# resolved automatically by `pnpm install`. zdtp ships its own prebuilt
# dist/. There is no from-source clone/build/link step — a plain
# `pnpm install --frozen-lockfile` is all each job needs. Dep versions are
# pinned in package.json (single source of truth).
#
# Inter-job data sharing uses actions/upload-artifact + actions/download-artifact
# (retention-days: 1 keeps storage bounded; artifacts are scoped to a single run
# by default). This replaced an earlier actions/cache approach keyed by
# github.run_id: cache/save is best-effort and only WARNS on a failed key
# reservation, so the producer job stayed green while the cache never persisted,
# and the consumer's fail-on-cache-miss restore then hard-failed the run — a
# false-red that reddened main (re-runs also hit the run_id key-reservation
# collision). Artifacts are the purpose-built mechanism for intra-run handoff.
# Each handoff is tar'd into a single archive before upload: upload-artifact
# rejects paths containing ':' (tag routes like docs/tags/type:guide/), and a
# single-file transfer beats per-file upload of ~900 files.
#
# Concurrency: only one production deploy runs at a time.
# We do NOT cancel in-progress runs -- the earlier deploy should finish.
#
# ----------------------------------------------------------------------------
# Deployed artifact contract (8 categories, migrated to Workers static assets
# in epic #1691).
# Future edits MUST keep these intact in the dist/ directory passed to
# `wrangler deploy`:
#
#   (a) dist/index.html and per-route dist/**/index.html           (HTML pages)
#   (b) dist/404.html at root                                      (zfb #100)
#   (d) dist/sitemap.xml                                           (page route
#       pages/sitemap.xml.tsx, ADR-005)
#   (e) dist/search-index.json                                     (search-index
#       plugin, postBuild hook)
#   (f) dist/llms.txt + dist/llms-full.txt + per-locale variants   (llms-txt
#       plugin, postBuild hook)
#   (g) dist/doc-history/*.json                                    (merged in
#       from build-history job below)
#   (h) dist/_worker.js + dist/_zfb_inner.mjs                      (Workers entry
#       and sidecar — emitted by `@takazudo/zfb-adapter-cloudflare` because
#       pages/api/ai-chat.tsx exports `prerender = false`. See zfb.config.ts.
#       Excluded from public assets via dist/.assetsignore written at deploy time.)
#   (i) _headers / _routes.json — currently N/A, neither file is generated by
#       any zfb plugin or `public/` source today. Add to this list if introduced.
# ----------------------------------------------------------------------------

name: Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the zfb docs site (full clone — needed for SSG meta dates)
  # ---------------------------------------------------------------------------
  # fetch-depth: 0 is required so the doc-history preBuild step can call
  # `git log --follow` on each content file and populate
  # `.zfb/doc-history-meta.json` with real author/date values. Those
  # values are statically inlined by esbuild into the SSG HTML at build
  # time (via the #doc-history-meta tsconfig alias). A shallow clone
  # produces an empty manifest, which causes DocMetainfoArea to return
  # null and the visible Created/Updated/Author block to be absent from
  # every deployed page (#1479, SSG meta gap).
  #
  # SKIP_DOC_HISTORY is intentionally NOT set here: we want the preBuild
  # runner to execute with full git access. The build-history job still
  # runs in parallel to generate the per-page dropdown JSON files for the
  # DocHistory island.
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Check links
        # Strict mode to match pr-checks.yml and scripts/run-b4push.sh — bare
        # check:links is non-strict (exit 0 on findings), which previously
        # false-greened real broken links on main (#1985).
        run: pnpm run check:links -- --strict-broken --strict-absolute --allowlist=.check-links-allowlist

      - name: Archive site build output
        # tar preserves arbitrary route paths (upload-artifact rejects ':' in
        # paths, e.g. dist/docs/tags/type:guide/) and includes dotfiles.
        run: tar -cf "$RUNNER_TEMP/site-dist.tar" -C dist .

      - name: Upload site build output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: site-dist
          path: ${{ runner.temp }}/site-dist.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job: HTML validate (block-in-inline guard for #1490 regression)
  # ---------------------------------------------------------------------------
  # Mirrors pr-checks.yml html-validate job. Last-line gate before production
  # deploy; catches element-permitted-content violations after build-site.
  html-validate:
    name: HTML validate
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download site build output (from build-site)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-dist
          path: ${{ runner.temp }}
      - name: Extract site build output
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/site-dist.tar" -C dist

      - name: Run html-validate
        run: pnpm check:html

  # ---------------------------------------------------------------------------
  # Job 2: Build doc history JSONs (full clone — only this job needs it)
  # ---------------------------------------------------------------------------
  # The @takazudo/zudo-doc-history-server package is fully standalone (no zfb
  # consumption). fetch-depth: 0 so it can walk git history per content file.
  build-history:
    name: Build Doc History
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate doc history
        run: |
          pnpm --filter @takazudo/zudo-doc-history-server generate \
            --content-dir src/content/docs \
            --locale ja:src/content/docs-ja \
            --out-dir ../../doc-history-out

      - name: Archive doc history output
        run: tar -cf "$RUNNER_TEMP/doc-history.tar" -C doc-history-out .

      - name: Upload doc history output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: doc-history
          path: ${{ runner.temp }}/doc-history.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Cloudflare Workers (production)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [build-site, build-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download site build output (from build-site)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-dist
          path: ${{ runner.temp }}
      - name: Extract site build output
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/site-dist.tar" -C dist

      - name: Download doc history output (from build-history)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # Tolerant: doc history is an enhancement, not required to deploy. Mirrors
        # the original restore that omitted fail-on-cache-miss — the Prepare step
        # guards on the dir existing before merging.
        continue-on-error: true
        with:
          name: doc-history
          path: ${{ runner.temp }}
      - name: Extract doc history output
        continue-on-error: true
        run: mkdir -p doc-history-out && tar -xf "$RUNNER_TEMP/doc-history.tar" -C doc-history-out

      - name: Prepare deploy directory
        # Layout produced (Workers static assets, epic #1691):
        #   dist/index.html and per-route dist/**/index.html   (a) HTML pages
        #   dist/404.html                                      (b) 404 fallback
        #   dist/sitemap.xml                                   (d) sitemap
        #   dist/search-index.json                             (e) search plugin
        #   dist/llms*.txt                                     (f) llms-txt plugin
        #   dist/doc-history/*.json                            (g) merged below
        #   dist/_worker.js + dist/_zfb_inner.mjs              (h) Workers entry;
        #       excluded from public assets via .assetsignore
        #   dist/assets/                                       (CSS/JS bundles)
        #   dist/img/                                          (public/ pass-through)
        run: |
          # (g) Merge doc history JSONs into dist/doc-history/.
          if [ -d doc-history-out ] && [ "$(ls -A doc-history-out 2>/dev/null)" ]; then
            mkdir -p dist/doc-history
            cp -r doc-history-out/. dist/doc-history/
          fi
          # Exclude _worker.js and _zfb_inner.mjs from the public asset directory
          # so they are not served as downloadable files (wrangler.toml documents this).
          printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy to Cloudflare Workers (production)
        id: deploy
        run: npx wrangler@4.85.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Guardrail: assert that the deployed HTML has root-relative asset URLs
      # (stylesheet href and islands script src). If zfb silently drops the
      # `base` threading in a future version this step goes red before the
      # broken production site reaches users.
      - name: Verify production site has root asset URLs
        run: |
          set -euo pipefail
          PROD_URL="https://zudo-doc.takazudomodular.com/"
          echo "Checking root asset URLs at: $PROD_URL"
          HTML=$(curl -fsSL "$PROD_URL")
          # Use here-strings (not echo|grep) so grep -q exiting early on a
          # match cannot SIGPIPE upstream echo + flip pipefail.
          grep -qE 'href="/assets/' <<<"$HTML" \
            || { echo "::error::Production HTML missing root stylesheet href"; exit 1; }
          grep -qE 'src="/assets/' <<<"$HTML" \
            || { echo "::error::Production HTML missing root islands script src"; exit 1; }
          echo "OK: production site has root asset URLs"

      # Public-asset HTTP 200 gate — defends against broken public/ asset serving.
      - name: Public-asset smoke gate
        run: |
          set -euo pipefail
          PROD_URL="https://zudo-doc.takazudomodular.com"
          STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' "$PROD_URL/img/logo.svg")
          [ "$STATUS" = "200" ] || { echo "::error::$PROD_URL/img/logo.svg returned HTTP $STATUS, expected 200"; exit 1; }
          echo "OK: $PROD_URL/img/logo.svg returned HTTP 200"

      # CSS-shape gate — defends against #1395 (Sub-4 host-side workaround:
      # @theme { --color-*: initial; --spacing: initial; } reset).
      # Three structural invariants live in the composite action so all three
      # deploy workflows stay in sync automatically.
      - name: CSS-shape smoke gate (#1395)
        uses: ./.github/actions/css-shape-smoke-gate
        with:
          deploy-url: https://zudo-doc.takazudomodular.com

      # SSR endpoint smoke gate — asserts the Workers SSR entry is wired up
      # and responding with JSON (not a static 404.html from the asset layer).
      # A no-body POST to /api/ai-chat will return a validation error, but the
      # Content-Type must be application/json — if it's text/html the asset
      # layer served 404.html instead of the worker handler running.
      - name: POST /api/ai-chat returns JSON (SSR smoke gate)
        run: |
          set -euo pipefail
          PROD_URL="https://zudo-doc.takazudomodular.com"
          CONTENT_TYPE=$(curl -sS -o /dev/null -w '%{content_type}' \
            -X POST "$PROD_URL/api/ai-chat" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "POST /api/ai-chat Content-Type: $CONTENT_TYPE"
          echo "$CONTENT_TYPE" | grep -q 'application/json' \
            || { echo "::error::POST /api/ai-chat returned Content-Type '$CONTENT_TYPE', expected application/json (Workers SSR not firing — asset layer returned 404.html?)"; exit 1; }
          echo "OK: POST /api/ai-chat returned application/json"

  # ---------------------------------------------------------------------------
  # Job 4: Send IFTTT notification with deploy status
  # ---------------------------------------------------------------------------
  notify:
    name: Deploy Notification
    needs: [build-site, build-history, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify via IFTTT
        if: env.IFTTT_PROD_NOTIFY != ''
        env:
          IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUILD_SITE_RESULT: ${{ needs.build-site.result }}
          BUILD_HISTORY_RESULT: ${{ needs.build-history.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="zudo-doc deploy succeeded!"
          elif [ "$BUILD_SITE_RESULT" = "failure" ]; then
            STATUS="zudo-doc deploy failed (site build)"
          elif [ "$BUILD_HISTORY_RESULT" = "failure" ]; then
            STATUS="zudo-doc deploy failed (history build)"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            STATUS="zudo-doc deploy failed (deploy)"
          else
            STATUS="zudo-doc deploy cancelled"
          fi

          COMMIT_MSG=$(printf '%s\n' "$RAW_COMMIT_MSG" | head -1)
          SHORT_SHA=$(echo "$GITHUB_SHA_VAL" | cut -c1-7)
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg v1 "$STATUS" \
            --arg v2 "$SHORT_SHA $COMMIT_MSG" \
            --arg v3 "$RUN_URL" \
            '{"value1":$v1,"value2":$v2,"value3":$v3}')

          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" || echo "::warning::IFTTT notification failed"

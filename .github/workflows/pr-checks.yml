# Pull request quality checks and preview deployment.
#
# Triggered on PRs targeting `main` or any `base/**` branch (epic-PRs in
# the zfb migration parity super-epic stack into base/zfb-migration-parity
# so each child epic-PR also needs CI gating). The pipeline mirrors the
# local `pnpm b4push` script:
#   0. Template drift check (no install needed — pure shell)
#   1. Type checking (`zfb check` → tsc --noEmit)
#   2. Build the zfb docs site (full clone — needed for SSG meta dates)
#   3. HTML validate the built dist/
#   4. Build doc history JSONs (full clone, standalone server package)
#   5. E2E & smoke tests (Playwright)
#   6. Merge build outputs and deploy a preview to Cloudflare Workers static assets
#   7. Post the preview URL as a PR comment
#
# zfb and zdtp are consumed directly from npm (see package.json):
#   - @takazudo/zfb + @takazudo/zfb-runtime + @takazudo/zfb-adapter-cloudflare
#     ship the CLI; the actual prebuilt Rust binary arrives via a
#     platform-specific optionalDependency (@takazudo/zfb-<platform>) that
#     `pnpm install` resolves automatically. On the ubuntu-latest runners and
#     the Playwright container (both linux-x64) that is @takazudo/zfb-linux-x64-gnu.
#   - @takazudo/zdtp ships its own prebuilt dist/.
# There is no from-source clone/build/link step anymore — a plain
# `pnpm install --frozen-lockfile` is all each job needs. Dep versions are
# pinned in package.json (single source of truth).
#
# Inter-job data sharing uses actions/cache (not upload-artifact) for build
# outputs to avoid Actions storage accumulation.
#
# Concurrency: cancel in-progress runs for the same PR to save resources.

name: PR Checks

on:
  pull_request:
    branches:
      - main
      - 'base/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Template drift check (lightweight, no pnpm install needed)
  # ---------------------------------------------------------------------------
  check-template-drift:
    name: Template Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Check template drift
        run: bash scripts/check-template-drift.sh

  # ---------------------------------------------------------------------------
  # Job 0.5: Pin parity check (lightweight, no pnpm install needed)
  # ---------------------------------------------------------------------------
  # Verifies @takazudo/zfb / @takazudo/zfb-runtime pins are identical
  # between root package.json and packages/create-zudo-doc/src/scaffold.ts.
  # Failure mode "W1A §5#4 — three pin sources, only one bumped" (W4A — #1732).
  # Pure-Node script — uses preinstalled Node 22 on the runner image, no pnpm.
  check-pin-parity:
    name: Pin Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Check pin parity
        run: node scripts/check-pin-parity.mjs

  # ---------------------------------------------------------------------------
  # Job 1: Type checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm check

  # ---------------------------------------------------------------------------
  # Job 1.5: Package unit suites
  # ---------------------------------------------------------------------------
  # Guards the gap from #1851: package-scoped vitest suites previously ran
  # only inside publish workflows, so a broken suite was invisible until a
  # publish attempt. This job runs all 5 package suites on every PR so a
  # broken suite turns the PR red instead of hiding until release day.
  #
  # Build step precedes the test run for clean-runner parity: @takazudo/zudo-doc
  # ships compiled dist/ (built by tsup). The publish workflow runs
  # `pnpm --filter @takazudo/zudo-doc build` before its test step for the same
  # reason — a fresh CI runner has no pre-existing dist/ and the suite may
  # import it.
  package-tests:
    name: Package Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build @takazudo/zudo-doc before testing — clean-runner parity; the
      # suite may import built dist/ which does not exist on a fresh runner.
      - name: Build @takazudo/zudo-doc
        run: pnpm --filter @takazudo/zudo-doc build

      - name: Run package unit tests
        run: pnpm test:packages

  # ---------------------------------------------------------------------------
  # Job 2: Build the zfb docs site (full clone — needed for SSG meta dates)
  # ---------------------------------------------------------------------------
  # fetch-depth: 0 is required so the doc-history preBuild step can call
  # `git log --follow` on each content file and populate
  # `.zfb/doc-history-meta.json` with real author/date values. Those
  # values are statically inlined by esbuild into the SSG HTML at build
  # time (via the #doc-history-meta tsconfig alias). A shallow clone
  # produces an empty manifest, which causes DocMetainfoArea to return
  # null and the visible Created/Updated/Author block to be absent from
  # every deployed page (#1479, SSG meta gap).
  #
  # SKIP_DOC_HISTORY is intentionally NOT set here: we want the preBuild
  # runner to execute with full git access. The build-history job still
  # runs in parallel to generate the per-page dropdown JSON files for the
  # DocHistory island.
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Check links
        run: pnpm run check:links

      - name: Cache site build output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job: HTML validate (block-in-inline guard for #1490 regression)
  # ---------------------------------------------------------------------------
  # Runs html-validate against the full dist/ produced by build-site. Catches
  # element-permitted-content violations (e.g. <span><pre>) before merge.
  html-validate:
    name: HTML validate
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore dist cache (built by build-site)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run html-validate
        run: pnpm check:html

  # ---------------------------------------------------------------------------
  # Job 3: Build doc history JSONs (full clone — only this job needs it)
  # ---------------------------------------------------------------------------
  # The @takazudo/zudo-doc-history-server package is fully standalone (only depends
  # on @types/node + tsup + tsx + typescript + vitest — no zfb consumption).
  # fetch-depth: 0 so it can walk git history for every content file.
  build-history:
    name: Build Doc History
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate doc history
        run: |
          pnpm --filter @takazudo/zudo-doc-history-server generate \
            --content-dir ../../src/content/docs \
            --locale ja:../../src/content/docs-ja \
            --out-dir ../../doc-history-out

      - name: Cache doc history output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: doc-history-out/
          key: doc-history-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job 4: E2E & smoke tests
  # ---------------------------------------------------------------------------
  # The Playwright container ships Node + browsers; the linux-x64 zfb binary
  # arrives via the platform optionalDependency at `pnpm install` time.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # renovate: datasource=docker depName=mcr.microsoft.com/playwright versioning=docker
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E & smoke tests
        run: pnpm test:e2e:ci

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 5: Deploy preview and comment on PR
  # ---------------------------------------------------------------------------
  preview:
    name: Preview Deploy
    needs: [build-site, build-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Restore site build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore doc history cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: doc-history-out/
          key: doc-history-${{ github.run_id }}

      - name: Prepare dist for deployment
        # Workers static assets: deploy directly from dist/ (no deploy/pj/zudo-doc/
        # nesting). zfb emits a flat dist/ — the dist/client/ Astro hybrid-mode
        # shape is never produced. Write .assetsignore so _worker.js and
        # _zfb_inner.mjs are not served as downloadable public files.
        run: |
          # (g) Merge doc history JSONs into dist/ directly.
          if [ -d doc-history-out ] && [ "$(ls -A doc-history-out 2>/dev/null)" ]; then
            mkdir -p dist/doc-history
            cp -r doc-history-out/. dist/doc-history/
          fi
          # Exclude worker bundle files from the public asset directory.
          printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy PR preview to Cloudflare Workers
        id: cf-deploy
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          ALIAS="pr-${PR_NUMBER}"
          # pr-${PR_NUMBER} is alias-safe (lowercase, no slashes/underscores).
          # `wrangler versions upload` has no --json flag; it prints the stable
          # preview-alias URL (on *.workers.dev — requires preview_urls = true
          # in wrangler.toml) to stdout/stderr. Capture both via tee and grep
          # the alias URL line, anchored on the .workers.dev boundary. Parse the
          # alias URL (subdomain starts with the alias) — not the per-version
          # hash URL — so smoke gates + PR comments hit a stable host.
          DEPLOY_LOG=$(mktemp)
          npx wrangler@4 versions upload \
            --preview-alias "$ALIAS" \
            2>&1 | tee "$DEPLOY_LOG"
          DEPLOY_URL=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to parse alias preview URL for '$ALIAS' from wrangler output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Guardrail: assert that the deployed PR preview HTML has root asset URLs
      # (stylesheet href and islands script src). Under Workers static assets
      # with base="/", asset paths are root-relative (/assets/...) not
      # /pj/zudo-doc/-prefixed. If zfb silently drops the `base` threading in
      # a future version this step goes red before the broken preview reaches
      # the user — fixing the gap documented in epic #1386 / #1389.
      - name: Verify deployed PR preview has root asset URLs
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.cf-deploy.outputs.deploy_url }}/"
          echo "Checking root asset URLs at: $PREVIEW_URL"
          HTML=$(curl -fsSL "$PREVIEW_URL")
          # Use here-strings (not echo|grep) so grep -q exiting early on a
          # match cannot SIGPIPE upstream echo + flip pipefail.
          grep -qE 'href="/assets/' <<<"$HTML" \
            || { echo "::error::Preview HTML missing root stylesheet href"; exit 1; }
          grep -qE 'src="/assets/' <<<"$HTML" \
            || { echo "::error::Preview HTML missing root islands script src"; exit 1; }
          echo "OK: deployed PR preview has root asset URLs"

      # Public-asset HTTP 200 gate — defends against #1394 (public/ assets
      # served at root under Workers static assets).
      - name: Public-asset smoke gate (#1394)
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' "$DEPLOY_URL/img/logo.svg")
          [ "$STATUS" = "200" ] || { echo "::error::$DEPLOY_URL/img/logo.svg returned HTTP $STATUS, expected 200"; exit 1; }
          echo "OK: $DEPLOY_URL/img/logo.svg returned HTTP 200"

      # CSS-shape gate — defends against #1395 (Sub-4 host-side workaround:
      # @theme { --color-*: initial; --spacing: initial; } reset).
      # Three structural invariants (no class-name greps — fragile against
      # Tailwind escaping and minification churn).
      - name: CSS-shape smoke gate (#1395)
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          CSS_PATH=$(curl -fsSL "$DEPLOY_URL/" | grep -oE 'href="[^"]*assets/styles-[^"]*\.css"' | head -1 | sed 's/href="//;s/"$//')
          [ -n "$CSS_PATH" ] || { echo "::error::no CSS link found in $DEPLOY_URL/"; exit 1; }
          curl -fsSL "${DEPLOY_URL}${CSS_PATH}" -o /tmp/deployed-css.css

          CSS_BYTES=$(wc -c < /tmp/deployed-css.css)
          MIN_CSS_BYTES=50000  # post-zfb#159 split-import fix (in pin 9239267) drops leaked Tailwind defaults; healthy baseline ~64-66 KB (down from pre-fix ~77.7 KB). Threshold sits well above the ~30-40 KB broken-scanner floor with headroom for future intentional shrinkage.
          [ "$CSS_BYTES" -ge "$MIN_CSS_BYTES" ] || { echo "::error::deployed CSS is $CSS_BYTES bytes, below threshold $MIN_CSS_BYTES (broken scanner produces ~30-40 KB)"; exit 1; }

          MEDIA_COUNT=$(grep -cE '^@media' /tmp/deployed-css.css || true)
          MIN_MEDIA=3  # tuned from the Sub-2 manager-confirm baseline (post-fix has 4 @media; threshold 3 leaves one block of safety)
          [ "$MEDIA_COUNT" -ge "$MIN_MEDIA" ] || { echo "::error::deployed CSS has $MEDIA_COUNT @media blocks, below threshold $MIN_MEDIA"; exit 1; }

          LEAKED_DEFAULT_COLORS=$(grep -cE -- '--color-(gray|zinc|red|amber|green|cyan|blue|indigo|purple|slate)-[0-9]+:' /tmp/deployed-css.css || true)
          MAX_DEFAULT_THEME_COLOR_TOKENS=2  # tuned from the Sub-2 manager-confirm baseline (post-fix has 0; broken state has 36)
          [ "$LEAKED_DEFAULT_COLORS" -le "$MAX_DEFAULT_THEME_COLOR_TOKENS" ] || { echo "::error::deployed CSS has $LEAKED_DEFAULT_COLORS leaked Tailwind default color tokens, above threshold $MAX_DEFAULT_THEME_COLOR_TOKENS (zfb user_has_import blind-spot regression)"; exit 1; }

          echo "OK: deployed CSS is $CSS_BYTES bytes, $MEDIA_COUNT @media blocks, $LEAKED_DEFAULT_COLORS leaked default color tokens"

      # AI-chat endpoint smoke gate — assert POST /api/ai-chat returns a JSON
      # content-type (not a static 404 page). A text/html response means the
      # Worker SSR route is not being reached (Workers static-assets placement
      # regression). HTTP 4xx from the endpoint is acceptable (empty body may
      # be rejected); only the content-type matters.
      - name: AI-chat endpoint smoke gate
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          CONTENT_TYPE=$(curl -s -o /dev/null -w '%{content_type}' \
            -X POST "$DEPLOY_URL/api/ai-chat" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "POST /api/ai-chat → Content-Type: $CONTENT_TYPE"
          echo "$CONTENT_TYPE" | grep -qi 'application/json' \
            || { echo "::error::POST /api/ai-chat returned Content-Type '$CONTENT_TYPE', expected application/json (static 404 fallback?)"; exit 1; }
          echo "OK: /api/ai-chat returns JSON content-type"

      - name: Comment preview URL on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = context.issue.number;
            const marker = '<!-- cf-preview-pr -->';

            const body = [
              marker,
              `## Cloudflare Workers Preview`,
              '',
              `Preview deployment is ready.`,
              '',
              `| | URL |`,
              `|---|---|`,
              `| Preview | ${deployUrl} |`,
              '',
              `Built from commit: \`${context.sha.substring(0, 7)}\``,
            ].join('\n');

            // Look for an existing comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing preview comment (id: ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new preview comment');
            }

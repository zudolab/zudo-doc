# TEMPORARY: rolldown-vs-esbuild trial on Linux and Windows. Remove before merging.
# Builds zfb from source with the non-default `rolldown-prototype` feature, then builds
# this site with esbuild and with Rolldown on the same binary and compares the output.
# See Takazudo/zudo-front-builder#4407.
name: Rolldown trial

on:
  push:
    branches:
      - claude/project-thread-62t43j
    paths:
      - .github/workflows/rolldown-trial.yml
      - .github/rolldown-trial/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolldown-trial-${{ github.ref }}
  cancel-in-progress: true

env:
  ZFB_REF: addf681f12056d0614d1758564802f81ff1cf3e3
  DOC_HISTORY_SKIP_POSTBUILD: "1"

jobs:
  # zudo-doc's workspace package build scripts are not Windows-portable, so build them on
  # Linux and hand the platform-independent output to the Windows job.
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Build workspace packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build:workspace
          git ls-files -o -i --exclude-standard -- packages | grep -v node_modules > ../generated.txt
          tar -cf workspace-build.tar -T ../generated.txt
          wc -l ../generated.txt

      - name: Upload workspace build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-build
          path: workspace-build.tar

  trial:
    name: trial (windows-latest)
    needs: workspace
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: site

      - name: Checkout zfb
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: Takazudo/zudo-front-builder
          ref: ${{ env.ZFB_REF }}
          path: zfb

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          package_json_file: site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: site/.nvmrc
          package-manager-cache: false

      - name: Restore zfb build
        id: zfb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: zfb/target/release/zfb.exe
          key: rolldown-trial-zfb-${{ runner.os }}-${{ env.ZFB_REF }}

      - name: Install zfb workspace deps
        if: steps.zfb-cache.outputs.cache-hit != 'true'
        working-directory: zfb
        # zfb pins pnpm 12; pnpm 10's self-switch to it fails on Windows runners.
        run: npx -y pnpm@12.8.2 install --frozen-lockfile

      - name: Build zfb with rolldown-prototype
        if: steps.zfb-cache.outputs.cache-hit != 'true'
        working-directory: zfb
        run: cargo build --release --locked -p zfb --features rolldown-prototype

      - name: Save zfb build
        if: steps.zfb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: zfb/target/release/zfb.exe
          key: rolldown-trial-zfb-${{ runner.os }}-${{ env.ZFB_REF }}

      - name: Download workspace build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-build

      - name: Install site deps and swap in the built zfb
        working-directory: site
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          tar -xf ../workspace-build.tar
          target="node_modules/.pnpm/@takazudo+zfb-win32-x64-msvc@4.6.0/node_modules/@takazudo/zfb-win32-x64-msvc/zfb.exe"
          ls -la "$target"
          cp ../zfb/target/release/zfb.exe "$target"
          pnpm exec zfb --version

      - name: Build with esbuild
        working-directory: site
        run: |
          start=$(date +%s); pnpm exec zfb build; echo "esbuild build took $(( $(date +%s) - start ))s"
          mv dist ../dist-esbuild

      - name: Build with Rolldown
        working-directory: site
        env:
          ZFB_ROLLDOWN_PROTOTYPE: "1"
        run: |
          start=$(date +%s); pnpm exec zfb build 2>&1 | tee ../rolldown-build.log; echo "rolldown build took $(( $(date +%s) - start ))s"
          echo "rolldown warnings: $(grep -c 'Rolldown warning' ../rolldown-build.log || true)"
          mv dist ../dist-rolldown

      - name: Compare output
        run: |
          node site/.github/rolldown-trial/compare.mjs manifest dist-esbuild manifest-esbuild.json
          node site/.github/rolldown-trial/compare.mjs manifest dist-rolldown manifest-rolldown.json
          node site/.github/rolldown-trial/compare.mjs diff manifest-esbuild.json manifest-rolldown.json

      - name: Upload manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolldown-trial-windows
          path: |
            manifest-*.json
            rolldown-build.log

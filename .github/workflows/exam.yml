# Nightly scheduled full-suite run (T3 tier) + on-demand workflow_dispatch.
#
# Runs everything that is intentionally excluded from PR checks (too slow,
# quarantine lane, slow integration tests) so regressions surface before
# they accumulate.
#
# Jobs:
#   e2e-full        — full e2e suite (CI-safe lane) + quarantine @flaky lane
#   slow-create     — create-zudo-doc slow integration tests (real npm install + zfb build)
#   slow-zudo-doc   — @takazudo/zudo-doc slow route-injection-build test (real zfb builds +
#                     npm pack; #2530 — moved out of pnpm test/pr-checks package-tests)
#   theme-a11y      — rendered per-theme-pack WCAG contrast audit (scripts/theme-a11y-audit.ts);
#                     too slow/still-maturing for pr-checks, so it's T3-only (#3036)
#
# Failure reporting:
#   scripts/file-exam-issue.sh  — deduped failure issue, scoped per-workflow-job-identity
#                                  (one open issue per exam job, not shared across jobs
#                                  despite the common `exam-failure` label); `--green`
#                                  closes it with a comment on the next passing run
#                                  (zudolab/zudo-doc#2535)
#   scripts/report-flaky-lane.mjs — posts pass/fail telemetry to each @flaky test's
#                                    linked tracking issue
#   scripts/report-retry-flakes.mjs — CI-safe-suite retry-pass triage signal; files/
#                                      appends a deduped `retry-flake`-labeled issue
#                                      per offending test (zudolab/zudo-doc#2535)
#
# To run on-demand against any branch:
#   gh workflow run exam.yml --ref <branch>

name: Nightly Exam

on:
  schedule:
    # 02:43 JST (17:43 UTC the previous day) — off-peak, not :00 or :30
    - cron: '43 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Full E2E — CI-safe suite + quarantine @flaky lane
  # ---------------------------------------------------------------------------
  e2e-full:
    name: Full E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # renovate: datasource=docker depName=mcr.microsoft.com/playwright versioning=docker
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step A: CI-safe suite (grep-invert @local-only, same as pr-checks e2e)
      # JSON output path is set via PLAYWRIGHT_JSON_OUTPUT_NAME with `--reporter=json`.
      # Playwright 1.58 does NOT support the `--reporter=json:<path>` colon syntax
      # (it treats the suffix as a reporter MODULE name → MODULE_NOT_FOUND); the
      # env var is the supported way to redirect the json reporter's file output.
      - name: Run CI-safe E2E suite
        run: pnpm test:e2e:ci:json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/ci-results.json

      - name: Report retry flakes
        if: always()
        run: node scripts/report-retry-flakes.mjs playwright-report/ci-results.json
        env:
          # Used to file/append a deduped `retry-flake` issue per offending
          # test; degrades to annotation-only if this ever runs without a
          # usable token — see scripts/report-retry-flakes.mjs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Step B: quarantine @flaky lane — zero tests is acceptable; pass-with-no-tests
      # avoids "no tests found" being treated as an error in a currently-empty lane.
      - name: Run quarantine @flaky lane
        run: >
          npx playwright test
          --grep @flaky
          --reporter=list,json
          --pass-with-no-tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/flaky-results.json

      - name: Report quarantine telemetry
        if: always()
        run: |
          if [ -f playwright-report/flaky-results.json ]; then
            node scripts/report-flaky-lane.mjs \
              --report playwright-report/flaky-results.json \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No flaky lane report found — skipping telemetry"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: File failure issue (CI-safe suite)
        if: failure()
        run: |
          bash scripts/file-exam-issue.sh \
            --report playwright-report/ci-results.json \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / Full E2E Tests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # success() here means the CI-safe suite step didn't fail — the
      # continue-on-error @flaky lane never flips this to false. Closes the
      # tracking issue (if one is open) the run after a fix lands.
      - name: Close exam issue on green run (CI-safe suite)
        if: success()
        run: |
          bash scripts/file-exam-issue.sh \
            --green \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / Full E2E Tests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: exam-e2e-reports
          # test-results/ carries the on-first-retry trace zips + failure
          # screenshots (Playwright's outputDir default); playwright-report/
          # carries the JSON reports. Neither dir is nested in the other.
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: create-zudo-doc slow integration tests
  # ---------------------------------------------------------------------------
  # Runs `test:slow` which exercises real `pnpm install` against the registry
  # + a full zfb build. Too expensive for every PR; runs nightly here.
  slow-create:
    name: create-zudo-doc Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run create-zudo-doc slow tests
        run: pnpm --filter create-zudo-doc test:slow

      - name: File failure issue
        if: failure()
        run: |
          bash scripts/file-exam-issue.sh \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / create-zudo-doc Slow Tests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Close exam issue on green run
        if: success()
        run: |
          bash scripts/file-exam-issue.sh \
            --green \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / create-zudo-doc Slow Tests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Job 3: @takazudo/zudo-doc slow route-injection-build test
  # ---------------------------------------------------------------------------
  # Runs `test:slow`, which exercises ~11 real `zfb build`s (the injected-route
  # byte-parity proof, PKGWIRE #2425 / A2 #2363) plus an `npm pack` round trip —
  # ~220s total, previously part of the default `pnpm test` / pr-checks
  # package-tests lane. Moved to the slow tier and this nightly job so that
  # lane stays fast (#2530).
  slow-zudo-doc:
    name: zudo-doc Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean-runner parity: the suite builds a fixture against this package's
      # dist/, which does not exist on a fresh runner (mirrors pr-checks'
      # package-tests job).
      - name: Build @takazudo/zudo-doc
        run: pnpm --filter @takazudo/zudo-doc build

      - name: Run @takazudo/zudo-doc slow tests
        run: pnpm --filter @takazudo/zudo-doc test:slow

      - name: File failure issue
        if: failure()
        run: |
          bash scripts/file-exam-issue.sh \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / zudo-doc Slow Tests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Close exam issue on green run
        if: success()
        run: |
          bash scripts/file-exam-issue.sh \
            --green \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / zudo-doc Slow Tests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Job 4: Theme A11y Audit — rendered per-theme-pack WCAG contrast audit
  # ---------------------------------------------------------------------------
  # scripts/theme-a11y-audit.ts renders the BUILT showcase once per (theme pack
  # × light/dark mode) via a real browser and reads computed styles — distinct
  # from the static `pnpm contrast:audit` guard (color schemes only, gated
  # elsewhere), which is structurally blind to theme-pack CSS. Needs a real
  # browser + a full site build, so it's T3-only (too slow for pr-checks'
  # e2e budget) rather than part of b4push/pr-checks (#3036). Requires a
  # prebuilt dist/ — see scripts/theme-a11y-audit.ts's usage header.
  theme-a11y:
    name: Theme A11y Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # renovate: datasource=docker depName=mcr.microsoft.com/playwright versioning=docker
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean-runner parity: the showcase build resolves @takazudo/zudo-doc
      # through its dist/, which does not exist on a fresh runner (mirrors
      # the slow-zudo-doc job above).
      - name: Build @takazudo/zudo-doc
        run: pnpm --filter @takazudo/zudo-doc build

      - name: Build site
        run: pnpm build

      - name: Run theme a11y audit
        run: pnpm theme-a11y:audit

      - name: File failure issue
        if: failure()
        run: |
          bash scripts/file-exam-issue.sh \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / Theme A11y Audit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Close exam issue on green run
        if: success()
        run: |
          bash scripts/file-exam-issue.sh \
            --green \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow "Nightly Exam / Theme A11y Audit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # if: always() — the report matters most on failure (that's the whole
      # point of the artifact), but a WARN-only green run's report is also
      # worth keeping for trend-watching.
      - name: Upload theme a11y audit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: theme-a11y-audit-report
          path: theme-a11y-audit-out/
          retention-days: 14

# Preview deployment for preview and expreview/* branches.
#
# Triggered on pushes to `preview` and `expreview/**` branches.
# Builds the zfb docs site and deploys to Cloudflare Pages with a branch name
# so the preview URL is predictable (e.g. preview.zudo-doc.pages.dev).
#
# This is separate from PR preview deploys (handled by pr-checks.yml).
#
# zfb and zdtp are consumed directly from npm (see package.json). The zfb
# CLI's prebuilt Rust binary arrives via a platform-specific
# optionalDependency (@takazudo/zfb-linux-x64-gnu on these ubuntu runners),
# resolved automatically by `pnpm install`. zdtp ships its own prebuilt
# dist/. There is no from-source clone/build/link step — a plain
# `pnpm install --frozen-lockfile` is all each job needs. Dep versions are
# pinned in package.json (single source of truth).
#
# ----------------------------------------------------------------------------
# Deployed artifact contract — see main-deploy.yml top-of-file for the
# canonical 9-category list. Categories (a)–(i) MUST be preserved here in
# parity with production (audited in epic #1337 task 5).
#
# Category (g) doc-history is handled by a dedicated build-history job
# (full clone, fetch-depth: 0) that runs in parallel with build-site.
# The deploy job merges both artifacts — same shape as main-deploy.yml.
# The prior single-job inline approach (pnpm build without SKIP_DOC_HISTORY)
# did not reliably emit doc-history JSONs in CI, producing empty
# Created/Updated values in preview deploys (#1479, #1468).
#
# See the same SSR-placement note in main-deploy.yml about _worker.js: the
# CF Pages advanced-mode entry currently lands at deploy/pj/zudo-doc/_worker.js
# under the project's base path. Until the deploy layout is reshaped, SSR
# routes (currently only /api/ai-chat) will not work in preview either.
# ----------------------------------------------------------------------------

name: Preview Deploy

on:
  push:
    branches:
      - 'preview'
      - 'expreview/**'

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the zfb docs site (full clone — needed for SSG meta dates)
  # ---------------------------------------------------------------------------
  # fetch-depth: 0 is required so the doc-history preBuild step can call
  # `git log --follow` on each content file and populate
  # `.zfb/doc-history-meta.json` with real author/date values. Those
  # values are statically inlined by esbuild into the SSG HTML at build
  # time (via the #doc-history-meta tsconfig alias). A shallow clone
  # produces an empty manifest, which causes DocMetainfoArea to return
  # null and the visible Created/Updated/Author block to be absent from
  # every deployed page (#1479, SSG meta gap).
  #
  # SKIP_DOC_HISTORY is intentionally NOT set here: we want the preBuild
  # runner to execute with full git access. The build-history job still
  # runs in parallel to generate the per-page dropdown JSON files for the
  # DocHistory island.
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Cache site build output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job: HTML validate (block-in-inline guard for #1490 regression)
  # ---------------------------------------------------------------------------
  # Mirrors pr-checks.yml and main-deploy.yml html-validate job. preview-deploy
  # builds dist/ independently so the validator must be wired here too.
  html-validate:
    name: HTML validate
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore dist cache (built by build-site)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run html-validate
        run: pnpm check:html

  # ---------------------------------------------------------------------------
  # Job 2: Build doc history JSONs (full clone — only this job needs it)
  # ---------------------------------------------------------------------------
  # Mirrors main-deploy.yml build-history. doc-history-server is standalone
  # (no zfb consumption). fetch-depth: 0 so it can walk git history.
  build-history:
    name: Build Doc History
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate doc history
        run: |
          pnpm --filter @zudo-doc/doc-history-server generate \
            --content-dir ../../src/content/docs \
            --locale ja:../../src/content/docs-ja \
            --out-dir ../../doc-history-out

      - name: Cache doc history output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: doc-history-out/
          key: doc-history-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Cloudflare Pages (preview branch)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Preview
    needs: [build-site, build-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Restore site build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore doc history cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: doc-history-out/
          key: doc-history-${{ github.run_id }}

      - name: Determine branch name
        id: branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # Convert slashes to hyphens (expreview/foo -> expreview-foo)
          DEPLOY_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          echo "name=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Deploy branch: $DEPLOY_BRANCH"

      - name: Prepare deploy directory
        # Mirror of main-deploy.yml's prepare step. See that file for the
        # 9-category artifact contract.
        # (g) doc-history JSONs are merged from the build-history job cache.
        # The dist/client/ branch is a legacy Astro fallback and never runs
        # under zfb (zfb emits a flat dist/).
        run: |
          mkdir -p deploy/pj/zudo-doc
          if [ -d dist/client ]; then
            cp -r dist/client/. deploy/pj/zudo-doc/
          else
            cp -r dist/. deploy/pj/zudo-doc/
          fi
          # (g) Merge doc history JSONs into the deploy directory.
          if [ -d doc-history-out ] && [ "$(ls -A doc-history-out 2>/dev/null)" ]; then
            mkdir -p deploy/pj/zudo-doc/doc-history
            cp -r doc-history-out/. deploy/pj/zudo-doc/doc-history/
          fi
          # (c) Root-level _redirects: bare-domain hits land on the based site.
          # /favicon.ico: browsers request this automatically as a fallback;
          # redirect to the real SVG favicon under the base path (#1533).
          # Changelog slug changed from /docs/changelog/010/ (old prod URL, no dots)
          # to /docs/changelog/0.1.0/ (file-routed). Both slash variants and the
          # JA locale are covered to preserve all external bookmarks (#1536).
          printf '%s\n' \
            '/ /pj/zudo-doc/ 302' \
            '/favicon.ico /pj/zudo-doc/favicon.svg 301' \
            '/pj/zudo-doc/docs/changelog/010 /pj/zudo-doc/docs/changelog/0.1.0/ 301' \
            '/pj/zudo-doc/docs/changelog/010/ /pj/zudo-doc/docs/changelog/0.1.0/ 301' \
            '/pj/zudo-doc/ja/docs/changelog/010 /pj/zudo-doc/ja/docs/changelog/0.1.0/ 301' \
            '/pj/zudo-doc/ja/docs/changelog/010/ /pj/zudo-doc/ja/docs/changelog/0.1.0/ 301' \
            > deploy/_redirects

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"

          # Cloudflare Pages truncates branch-alias subdomains to 28 chars,
          # so the served alias can differ from `https://${BRANCH}.zudo-doc.pages.dev`
          # whenever BRANCH is longer than 28 chars (e.g. expreview/long-name -> ...
          # -> expreview-long-name truncated to 28). Parse wrangler's actual
          # "Deployment alias URL:" line instead of reconstructing it, otherwise
          # the downstream verify steps hit 404 on the wrong subdomain.
          DEPLOY_LOG=$(mktemp)
          npx wrangler@4 pages deploy deploy \
            --project-name=zudo-doc \
            --branch="$BRANCH" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Preview: ${BRANCH} @ ${GITHUB_SHA:0:7}" \
            2>&1 | tee "$DEPLOY_LOG"

          DEPLOY_URL=$(awk '/Deployment alias URL:/ {for(i=1;i<=NF;i++) if($i ~ /^https?:\/\//) print $i}' "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to parse Deployment alias URL from wrangler output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Guardrail: assert that the deployed HTML has /pj/zudo-doc/-prefixed
      # asset URLs (stylesheet href and islands script src).  If zfb silently
      # drops the `base` threading in a future version this step goes red
      # before the broken preview reaches the user — fixing the gap documented
      # in epic #1386 / #1389 ("CI green is necessary but not sufficient for
      # feature delivered").
      - name: Verify deployed preview has prefixed asset URLs
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.deploy.outputs.deploy_url }}/pj/zudo-doc/"
          echo "Checking prefixed asset URLs at: $PREVIEW_URL"
          HTML=$(curl -fsSL "$PREVIEW_URL")
          # Use here-strings (not echo|grep) so grep -q exiting early on a
          # match cannot SIGPIPE upstream echo + flip pipefail.
          grep -qE 'href="/pj/zudo-doc/assets/' <<<"$HTML" \
            || { echo "::error::Preview HTML missing prefixed stylesheet href"; exit 1; }
          grep -qE 'src="/pj/zudo-doc/assets/' <<<"$HTML" \
            || { echo "::error::Preview HTML missing prefixed islands script src"; exit 1; }
          echo "OK: deployed preview has prefixed asset URLs"

      # Public-asset HTTP 200 gate — defends against #1394 (Sub-3 host-side
      # workaround: public/ assets served under the base path).
      - name: Public-asset smoke gate (#1394)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}/pj/zudo-doc
        run: |
          set -euo pipefail
          STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' "$DEPLOY_URL/img/logo.svg")
          [ "$STATUS" = "200" ] || { echo "::error::$DEPLOY_URL/img/logo.svg returned HTTP $STATUS, expected 200"; exit 1; }
          echo "OK: $DEPLOY_URL/img/logo.svg returned HTTP 200"

      # CSS-shape gate — defends against #1395 (Sub-4 host-side workaround:
      # @theme { --color-*: initial; --spacing: initial; } reset).
      # Three structural invariants (no class-name greps — fragile against
      # Tailwind escaping and minification churn).
      - name: CSS-shape smoke gate (#1395)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}/pj/zudo-doc
        run: |
          set -euo pipefail
          # CSS href is root-relative (/pj/zudo-doc/assets/...); prepend origin.
          ORIGIN="${DEPLOY_URL%%/pj*}"
          CSS_PATH=$(curl -fsSL "$DEPLOY_URL/" | grep -oE 'href="[^"]*assets/styles-[^"]*\.css"' | head -1 | sed 's/href="//;s/"$//')
          [ -n "$CSS_PATH" ] || { echo "::error::no CSS link found in $DEPLOY_URL/"; exit 1; }
          curl -fsSL "${ORIGIN}${CSS_PATH}" -o /tmp/deployed-css.css

          CSS_BYTES=$(wc -c < /tmp/deployed-css.css)
          MIN_CSS_BYTES=50000  # post-zfb#159 split-import fix (in pin 9239267) drops leaked Tailwind defaults; healthy baseline ~64-66 KB (down from pre-fix ~77.7 KB). Threshold sits well above the ~30-40 KB broken-scanner floor with headroom for future intentional shrinkage.
          [ "$CSS_BYTES" -ge "$MIN_CSS_BYTES" ] || { echo "::error::deployed CSS is $CSS_BYTES bytes, below threshold $MIN_CSS_BYTES (broken scanner produces ~30-40 KB)"; exit 1; }

          MEDIA_COUNT=$(grep -cE '^@media' /tmp/deployed-css.css || true)
          MIN_MEDIA=3  # tuned from the Sub-2 manager-confirm baseline (post-fix has 4 @media; threshold 3 leaves one block of safety)
          [ "$MEDIA_COUNT" -ge "$MIN_MEDIA" ] || { echo "::error::deployed CSS has $MEDIA_COUNT @media blocks, below threshold $MIN_MEDIA"; exit 1; }

          LEAKED_DEFAULT_COLORS=$(grep -cE -- '--color-(gray|zinc|red|amber|green|cyan|blue|indigo|purple|slate)-[0-9]+:' /tmp/deployed-css.css || true)
          MAX_DEFAULT_THEME_COLOR_TOKENS=2  # tuned from the Sub-2 manager-confirm baseline (post-fix has 0; broken state has 36)
          [ "$LEAKED_DEFAULT_COLORS" -le "$MAX_DEFAULT_THEME_COLOR_TOKENS" ] || { echo "::error::deployed CSS has $LEAKED_DEFAULT_COLORS leaked Tailwind default color tokens, above threshold $MAX_DEFAULT_THEME_COLOR_TOKENS (zfb user_has_import blind-spot regression)"; exit 1; }

          echo "OK: deployed CSS is $CSS_BYTES bytes, $MEDIA_COUNT @media blocks, $LEAKED_DEFAULT_COLORS leaked default color tokens"

      - name: Set commit status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const success = process.env.DEPLOY_OUTCOME === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: deployUrl || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Preview deployment ready' : 'Preview deployment failed',
              context: 'cloudflare/preview'
            });

      - name: Comment on associated PR
        if: success() && steps.deploy.outputs.deploy_url
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              console.log('No open PR found for this branch, skipping comment');
              return;
            }

            const pr = prs[0];
            const deployUrl = process.env.DEPLOY_URL;
            const shortSha = context.sha.substring(0, 7);
            const marker = '<!-- cf-preview-branch -->';

            const body = [
              marker,
              `## Cloudflare Pages Preview`,
              '',
              `Preview deployment is ready.`,
              '',
              `| | URL |`,
              `|---|---|`,
              `| Preview | ${deployUrl} |`,
              '',
              `Built from \`${branch}\` @ \`${shortSha}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

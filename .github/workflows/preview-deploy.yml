# Preview deployment for preview and expreview/* branches.
#
# Triggered on pushes to `preview` and `expreview/**` branches.
# Builds the zfb docs site and deploys to Cloudflare Workers Assets with a
# preview alias so the preview URL is predictable (e.g.
# preview-zudo-doc.<acct>.workers.dev).
#
# This is separate from PR preview deploys (handled by pr-checks.yml).
#
# zfb and zdtp are consumed directly from npm (see package.json). The zfb
# CLI's prebuilt Rust binary arrives via a platform-specific
# optionalDependency (@takazudo/zfb-linux-x64-gnu on these ubuntu runners),
# resolved automatically by `pnpm install`. zdtp ships its own prebuilt
# dist/. There is no from-source clone/build/link step — a plain
# `pnpm install --frozen-lockfile` is all each job needs. Dep versions are
# pinned in package.json (single source of truth).
#
# Inter-job data sharing uses actions/cache (not upload-artifact) to avoid
# Actions storage accumulation. Cache keys are scoped to github.run_id so
# each run gets a fresh, unique cache that won't be reused by other runs.
#
# ----------------------------------------------------------------------------
# Deployed artifact contract — see main-deploy.yml top-of-file for the
# canonical 8-category list (Workers static assets; category (c) _redirects
# was dropped in the Pages→Workers migration #1691). Categories (a),(b),(d)–(i)
# MUST be preserved here in parity with production (audited in epic #1337 task 5).
#
# Category (g) doc-history is handled by a dedicated build-history job
# (full clone, fetch-depth: 0) that runs in parallel with build-site.
# The deploy job merges both artifacts — same shape as main-deploy.yml.
# The prior single-job inline approach (pnpm build without SKIP_DOC_HISTORY)
# did not reliably emit doc-history JSONs in CI, producing empty
# Created/Updated values in preview deploys (#1479, #1468).
# ----------------------------------------------------------------------------

name: Preview Deploy

on:
  push:
    branches:
      - 'preview'
      - 'expreview/**'

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the zfb docs site (full clone — needed for SSG meta dates)
  # ---------------------------------------------------------------------------
  # fetch-depth: 0 is required so the doc-history preBuild step can call
  # `git log --follow` on each content file and populate
  # `.zfb/doc-history-meta.json` with real author/date values. Those
  # values are statically inlined by esbuild into the SSG HTML at build
  # time (via the #doc-history-meta tsconfig alias). A shallow clone
  # produces an empty manifest, which causes DocMetainfoArea to return
  # null and the visible Created/Updated/Author block to be absent from
  # every deployed page (#1479, SSG meta gap).
  #
  # SKIP_DOC_HISTORY is intentionally NOT set here: we want the preBuild
  # runner to execute with full git access. The build-history job still
  # runs in parallel to generate the per-page dropdown JSON files for the
  # DocHistory island.
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Cache site build output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job: HTML validate (block-in-inline guard for #1490 regression)
  # ---------------------------------------------------------------------------
  # Mirrors pr-checks.yml and main-deploy.yml html-validate job. preview-deploy
  # builds dist/ independently so the validator must be wired here too.
  html-validate:
    name: HTML validate
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore dist cache (built by build-site)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run html-validate
        run: pnpm check:html

  # ---------------------------------------------------------------------------
  # Job 2: Build doc history JSONs (full clone — only this job needs it)
  # ---------------------------------------------------------------------------
  # Mirrors main-deploy.yml build-history. doc-history-server is standalone
  # (no zfb consumption). fetch-depth: 0 so it can walk git history.
  build-history:
    name: Build Doc History
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate doc history
        run: |
          pnpm --filter @takazudo/zudo-doc-history-server generate \
            --content-dir src/content/docs \
            --locale ja:src/content/docs-ja \
            --out-dir ../../doc-history-out

      - name: Cache doc history output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: doc-history-out/
          key: doc-history-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Cloudflare Workers Assets (preview alias)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Preview
    needs: [build-site, build-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # wrangler reads wrangler.toml (Workers config) from the repo root at
      # upload time. Without checkout the runner has only the restored caches,
      # so the upload fails / uses wrong defaults. Mirrors main-deploy.yml.
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Restore site build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore doc history cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: doc-history-out/
          key: doc-history-${{ github.run_id }}

      - name: Determine branch slug
        id: branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # wrangler preview aliases must be lowercase [a-z0-9-] (no slashes,
          # underscores, dots, or uppercase). Lowercase, replace every invalid
          # char with a hyphen, collapse repeats, and trim leading/trailing
          # hyphens. e.g. expreview/Feature_X -> expreview-feature-x
          BRANCH_SLUG=$(echo "$BRANCH_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "Branch slug: $BRANCH_SLUG"

      - name: Prepare deploy directory
        # Workers Assets layout (base="/" — no pj/zudo-doc/ nesting):
        #   dist/index.html and per-route dist/**/index.html   (a) HTML pages
        #   dist/404.html                                       (b) zfb #100
        #   dist/sitemap.xml                                    (d) page route
        #   dist/search-index.json                              (e) plugin
        #   dist/llms*.txt                                      (f) plugin
        #   dist/doc-history/*.json                             (g) merged below
        #   dist/_worker.js + dist/_zfb_inner.mjs               (h) CF adapter
        #   dist/.assetsignore                                  excludes (h) from
        #                                                       public asset index
        #
        # .assetsignore is generated here (not committed to the repo) so that
        # _worker.js and _zfb_inner.mjs are excluded from the public asset
        # directory and are not served as downloadable files.
        run: |
          # (g) Merge doc history JSONs into dist/doc-history/
          if [ -d doc-history-out ] && [ "$(ls -A doc-history-out 2>/dev/null)" ]; then
            mkdir -p dist/doc-history
            cp -r doc-history-out/. dist/doc-history/
          fi
          # Write .assetsignore so _worker.js and _zfb_inner.mjs are excluded
          # from the public asset directory (not served as downloadable files).
          printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy to Cloudflare Workers Assets (preview alias)
        id: deploy
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"

          # `wrangler versions upload --preview-alias=<slug>` uploads a new
          # version and assigns a stable preview alias on *.workers.dev.
          # The stable alias URL line contains the slug in the subdomain.
          # Parse it — not the per-version hash URL — so smoke gates and PR
          # comments always target the stable, predictable alias host.
          DEPLOY_LOG=$(mktemp)
          # Pinned to 4.98.0 like main-deploy.yml for determinism (CF error
          # 10013 affects `deploy` post-upload on both 4.98/4.99; `versions
          # upload` here is unaffected so far).
          npx wrangler@4.98.0 versions upload \
            --preview-alias="$SLUG" \
            --message="Preview: ${SLUG} @ ${GITHUB_SHA:0:7}" \
            2>&1 | tee "$DEPLOY_LOG"

          # Match the stable alias URL: the subdomain starts with the slug
          # followed by a hyphen and the worker name (slug-zudo-doc), anchored
          # on the .workers.dev boundary so log noise after the URL can't be
          # swallowed. Parse this — not the per-version hash URL.
          DEPLOY_URL=$(grep -oE "https://${SLUG}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to parse alias preview URL for slug '$SLUG' from wrangler output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Guardrail: assert that the deployed HTML has root-relative asset URLs
      # (href="/assets/", src="/assets/"). With base="/" the build emits
      # root-prefixed paths — this step catches any regression where zfb
      # silently drops the base threading (epic #1386 / #1389).
      - name: Verify deployed preview has root asset URLs
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.deploy.outputs.deploy_url }}/"
          echo "Checking root asset URLs at: $PREVIEW_URL"
          HTML=$(curl -fsSL "$PREVIEW_URL")
          # Use here-strings (not echo|grep) so grep -q exiting early on a
          # match cannot SIGPIPE upstream echo + flip pipefail.
          grep -qE 'href="/assets/' <<<"$HTML" \
            || { echo "::error::Preview HTML missing root stylesheet href (expected href=\"/assets/...)"; exit 1; }
          grep -qE 'src="/assets/' <<<"$HTML" \
            || { echo "::error::Preview HTML missing root islands script src (expected src=\"/assets/...)"; exit 1; }
          echo "OK: deployed preview has root asset URLs"

      # Public-asset HTTP 200 gate — defends against #1394 (Sub-3 host-side
      # workaround: public/ assets served under the base path).
      - name: Public-asset smoke gate (#1394)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' "$DEPLOY_URL/img/logo.svg")
          [ "$STATUS" = "200" ] || { echo "::error::$DEPLOY_URL/img/logo.svg returned HTTP $STATUS, expected 200"; exit 1; }
          echo "OK: $DEPLOY_URL/img/logo.svg returned HTTP 200"

      # CSS-shape gate — defends against #1395 (Sub-4 host-side workaround:
      # @theme { --color-*: initial; --spacing: initial; } reset).
      # Three structural invariants (no class-name greps — fragile against
      # Tailwind escaping and minification churn).
      - name: CSS-shape smoke gate (#1395)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          CSS_PATH=$(curl -fsSL "$DEPLOY_URL/" | grep -oE 'href="[^"]*assets/styles-[^"]*\.css"' | head -1 | sed 's/href="//;s/"$//')
          [ -n "$CSS_PATH" ] || { echo "::error::no CSS link found in $DEPLOY_URL/"; exit 1; }
          # CSS href is root-relative (/assets/...); prepend the deploy origin.
          curl -fsSL "${DEPLOY_URL}${CSS_PATH}" -o /tmp/deployed-css.css

          CSS_BYTES=$(wc -c < /tmp/deployed-css.css)
          MIN_CSS_BYTES=50000  # post-zfb#159 split-import fix (in pin 9239267) drops leaked Tailwind defaults; healthy baseline ~64-66 KB (down from pre-fix ~77.7 KB). Threshold sits well above the ~30-40 KB broken-scanner floor with headroom for future intentional shrinkage.
          [ "$CSS_BYTES" -ge "$MIN_CSS_BYTES" ] || { echo "::error::deployed CSS is $CSS_BYTES bytes, below threshold $MIN_CSS_BYTES (broken scanner produces ~30-40 KB)"; exit 1; }

          MEDIA_COUNT=$(grep -cE '^@media' /tmp/deployed-css.css || true)
          MIN_MEDIA=3  # tuned from the Sub-2 manager-confirm baseline (post-fix has 4 @media; threshold 3 leaves one block of safety)
          [ "$MEDIA_COUNT" -ge "$MIN_MEDIA" ] || { echo "::error::deployed CSS has $MEDIA_COUNT @media blocks, below threshold $MIN_MEDIA"; exit 1; }

          LEAKED_DEFAULT_COLORS=$(grep -cE -- '--color-(gray|zinc|red|amber|green|cyan|blue|indigo|purple|slate)-[0-9]+:' /tmp/deployed-css.css || true)
          MAX_DEFAULT_THEME_COLOR_TOKENS=2  # tuned from the Sub-2 manager-confirm baseline (post-fix has 0; broken state has 36)
          [ "$LEAKED_DEFAULT_COLORS" -le "$MAX_DEFAULT_THEME_COLOR_TOKENS" ] || { echo "::error::deployed CSS has $LEAKED_DEFAULT_COLORS leaked Tailwind default color tokens, above threshold $MAX_DEFAULT_THEME_COLOR_TOKENS (zfb user_has_import blind-spot regression)"; exit 1; }

          echo "OK: deployed CSS is $CSS_BYTES bytes, $MEDIA_COUNT @media blocks, $LEAKED_DEFAULT_COLORS leaked default color tokens"

      # SSR endpoint smoke gate — asserts the Workers SSR entry is wired up on
      # the preview alias and responding with JSON (not a static 404.html from
      # the asset layer). A no-body POST returns a validation error, but the
      # Content-Type must be application/json; text/html means the asset layer
      # served 404.html instead of the worker handler running. Mirrors the
      # production gate in main-deploy.yml — the same worker artifact deploys
      # here, so preview must exercise the same SSR assertion.
      - name: POST /api/ai-chat returns JSON (SSR smoke gate)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          CONTENT_TYPE=$(curl -sS -o /dev/null -w '%{content_type}' \
            -X POST "$DEPLOY_URL/api/ai-chat" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "POST /api/ai-chat Content-Type: $CONTENT_TYPE"
          echo "$CONTENT_TYPE" | grep -q 'application/json' \
            || { echo "::error::POST /api/ai-chat returned Content-Type '$CONTENT_TYPE', expected application/json (Workers SSR not firing — asset layer returned 404.html?)"; exit 1; }
          echo "OK: POST /api/ai-chat returned application/json"

      - name: Set commit status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const success = process.env.DEPLOY_OUTCOME === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: deployUrl || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Preview deployment ready' : 'Preview deployment failed',
              context: 'cloudflare/preview'
            });

      - name: Comment on associated PR
        if: success() && steps.deploy.outputs.deploy_url
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              console.log('No open PR found for this branch, skipping comment');
              return;
            }

            const pr = prs[0];
            const deployUrl = process.env.DEPLOY_URL;
            const shortSha = context.sha.substring(0, 7);
            const marker = '<!-- cf-preview-branch -->';

            const body = [
              marker,
              `## Cloudflare Workers Assets Preview`,
              '',
              `Preview deployment is ready.`,
              '',
              `| | URL |`,
              `|---|---|`,
              `| Preview | ${deployUrl} |`,
              '',
              `Built from \`${branch}\` @ \`${shortSha}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

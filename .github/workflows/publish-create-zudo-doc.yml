# Publish create-zudo-doc to npm with npm trusted publishing (OIDC).
#
# No stored npm credential is used anywhere in this workflow (#4745). npm
# authorizes the write by exchanging this job's GitHub OIDC token, which it
# accepts only for the trusted publisher configured on npmjs.com:
#   GitHub Actions · organization zudolab · repository zudo-doc ·
#   workflow publish-create-zudo-doc.yml · environment (empty)
# The npm scope (@takazudo) does not change the GitHub owner. The publish step
# refuses to run if a static token is present, so a successful run is evidence
# of OIDC operation.
#
# Triggers:
#   1. release: published — publishing the GitHub Release for a vX.Y.Z
#      tag. The other two publish workflows also start and skip NEUTRAL.
#   2. workflow_dispatch on the TAG ref (`gh workflow run publish-create-zudo-doc.yml --ref v1.2.3`)
#      — explicit initiation when no release event started a run (an event created
#      with a workflow's GITHUB_TOKEN never starts another workflow), and resumption
#      of an interrupted publication or finalization. dry_run: true never writes.
#   Both paths run THIS file, so the OIDC workflow identity is always
#   publish-create-zudo-doc.yml; there is deliberately no reusable-workflow coordinator, whose
#   caller would become the identity npm checks.
#
# Resumable: the guard classifies the registry state as absent (publish),
# present-from-this-source (resume finalization only; never republish) or
# unknown (fail closed). See RELEASE.md, "Publish workflows".
#
# Toolchain: pnpm 10 has no OIDC code — `pnpm publish` packs (rewriting
# `workspace:` specifiers) and runs `npm publish <tarball>` with the npm on PATH,
# so the toolchain step installs the reviewed, integrity-checked npm pinned in
# scripts/release/lib.mjs (NPM_CLI_PIN) and prints every tool version.

name: Publish create-zudo-doc

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — run guards, build, tests and a pack check; never writes to npm and does NOT verify write authorization'
        type: boolean
        required: false
        default: false

# Nothing at workflow level; the publish job grants only what it needs.
permissions: {}

# Serializes every publish/resume/cleanup of THIS package (race protection for
# dist-tag maintenance); the three packages still run independently.
concurrency:
  group: publish-create-zudo-doc
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # Trusted publishing supports GitHub-hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Releases for the other two namespaces skip this job NEUTRAL. The guard
    # re-checks the namespace with an anchored pattern.
    if: ${{ startsWith(github.event.release.tag_name || github.ref_name, 'v') }}

    steps:
      # Full history: the guard proves the tag commit is on origin/main.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          dest: ~/setup-pnpm-publish-create-zudo-doc

      - name: Install pinned npm CLI and print tool versions
        run: node scripts/release/publish-step.mjs toolchain

      # Tag namespace/semver, package.json version, checkout == tag commit,
      # commit on origin/main, sibling lockstep tags on the same commit, and the
      # registry state (absent / present-from-this-source / unknown → fail).
      - name: '[Safeguard] Release guard'
        id: guard
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          args=(guard --package create-zudo-doc --tag "$TAG")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          node scripts/release/publish-step.mjs "${args[@]}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build create-zudo-doc
        run: pnpm --filter create-zudo-doc build

      - name: Test create-zudo-doc
        run: pnpm --filter create-zudo-doc test

      # Scaffold pin freshness (RELEASE.md, "Scaffold pin freshness gate"). Runs
      # for a new publish and for a dry run; a resume of an already-published
      # version does not re-judge the pins it already shipped.
      - name: '[Safeguard] Scaffold pin freshness'
        if: ${{ steps.guard.outputs.mode == 'publish' }}
        shell: bash
        run: |
          if ! pnpm check:scaffold-pin-freshness; then
            echo "::error::A scaffold pin in packages/create-zudo-doc/src/scaffold.ts is stale, or the npm registry lookup failed. See RELEASE.md 'Scaffold pin freshness gate'."
            echo "::error::Remedy: bump the stale exact pin (RELEASE.md 'Bumping the toolchain'), run pnpm check:pin-parity, then cut the release again."
            exit 1
          fi

      # Nonmutating: proves the artifact packs and `workspace:` is rewritten.
      - name: Pack check
        run: node scripts/release/publish-step.mjs pack-check --package create-zudo-doc

      - name: Dry-run report
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          MODE: ${{ steps.guard.outputs.mode }}
        run: |
          {
            echo "### DRY RUN — nothing was written to npm"
            echo ""
            echo "Would $MODE create-zudo-doc@$VERSION with dist-tag $DIST_TAG."
            echo ""
            echo "Guards, build, tests and the pack check ran. Write authorization (the OIDC"
            echo "trusted publisher) is NOT verified by a dry run; only a real publish proves it."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm (OIDC)
        if: ${{ inputs.dry_run != true && steps.guard.outputs.mode == 'publish' }}
        run: node scripts/release/publish-step.mjs publish --package create-zudo-doc --tag "$TAG"

      # Runs for a fresh publish and for a resume: exact version, provenance from
      # this commit and workflow, and the expected channel (set via OIDC if it
      # lags; never moved backward).
      - name: Finalize and verify registry state
        if: ${{ inputs.dry_run != true }}
        env:
          MODE: ${{ steps.guard.outputs.mode }}
        run: node scripts/release/publish-step.mjs finalize --package create-zudo-doc --tag "$TAG" --mode "$MODE"

      # Stable graduation only. Isolated: its outcome is reported (summary and
      # step status) without failing an otherwise complete publication.
      - name: Stale next dist-tag maintenance
        id: cleanup
        if: ${{ inputs.dry_run != true && !contains(env.VERSION, '-') }}
        continue-on-error: true
        run: node scripts/release/publish-step.mjs cleanup-next --package create-zudo-doc --tag "$TAG"

      - name: Report maintenance outcome
        if: ${{ always() && steps.cleanup.outcome != '' && steps.cleanup.outcome != 'skipped' }}
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.cleanup.outcome }}
          RESULT: ${{ steps.cleanup.outputs.outcome }}
        run: |
          echo "next maintenance: step=$STEP_OUTCOME result=${RESULT:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$STEP_OUTCOME" != "success" ]]; then
            echo "::warning::next dist-tag maintenance did not complete (${RESULT:-error}); re-dispatch this workflow on $TAG to retry."
          fi

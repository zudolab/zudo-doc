# Actions release path for the three lockstep packages (RELEASE.md, "Actions
# release path"; zudolab/zudo-doc#4762).
#
# A session that must not push tags itself (e.g. Claude Code Cloud) dispatches
# this workflow on main with the fixed version, the accepted integration SHA and
# the A2 evidence identifiers. Nothing in those inputs is trusted: the read-only
# `admit` job re-derives the PR Checks run/attempt, the executed A2 job, the
# diagnostics artifact (downloaded and digest-checked), the tested checkout and
# tree, the PR merge result and every exact-SHA main workflow run, and refuses
# any difference.
#
# Jobs are split by the permission they need:
#   admit           contents/actions/pull-requests: read   — evidence only
#   tags            contents: write                        — three annotated tags
#   draft-releases  contents: write                        — one draft per tag
#   publish         actions: write                         — explicit workflow_dispatch
#                                                            of publish-*.yml, in order
#   finalize        contents: write, actions: read         — publish drafts after npm readback
#
# Tags created with GITHUB_TOKEN start no workflow, and nothing here expects
# them to: the publish workflows are dispatched explicitly on each tag, so their
# OIDC identity stays publish-<package>.yml (no reusable-workflow caller).
#
# stage: admit   → evidence only (no write)
#        tag     → admit + tags + draft releases (review the drafts, then run `publish`)
#        publish → all of the above (idempotent) + ordered publication + finalize
# Re-dispatching with the same inputs resumes: tags at the same SHA are kept, a
# tag elsewhere refuses, an active or finished publish run for the exact
# workflow/tag/SHA is attached to, and npm versions are never republished.

name: Release (Actions path)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fixed release version (X.Y.Z or X.Y.Z-pre.N)'
        type: string
        required: true
      integration_sha:
        description: 'Accepted main integration SHA (full 40-hex; the PR merge result)'
        type: string
        required: true
      pr_number:
        description: 'Release PR number'
        type: string
        required: true
      a2_run_id:
        description: 'PR Checks run ID that executed A2 on the frozen candidate'
        type: string
        required: true
      a2_run_attempt:
        description: 'Run attempt of that PR Checks run'
        type: string
        required: true
      candidate_sha:
        description: 'Frozen candidate head SHA (full 40-hex)'
        type: string
        required: true
      base_sha:
        description: 'Base SHA the PR Checks run used (full 40-hex)'
        type: string
        required: true
      a2_artifact_id:
        description: 'a2-route-parity-diagnostics artifact ID from that run/attempt'
        type: string
        required: true
      a2_artifact_digest:
        description: 'That artifact digest (sha256:...)'
        type: string
        required: true
      stage:
        description: 'admit = evidence only; tag = + tags and draft releases; publish = + ordered OIDC publication'
        type: choice
        options: [admit, tag, publish]
        default: admit

permissions: {}

# One release operation at a time; a running release is never cancelled by a
# later dispatch (which waits, and re-checks every state when it starts).
concurrency:
  group: release-actions
  cancel-in-progress: false

env:
  RELEASE_EVIDENCE: ${{ github.workspace }}/../release-evidence

jobs:
  admit:
    name: Admission (read-only)
    # Only the workflow source on main may act; a dispatch on any other ref stops here.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Re-derive and compare the release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_INTEGRATION: ${{ inputs.integration_sha }}
          IN_PR: ${{ inputs.pr_number }}
          IN_RUN: ${{ inputs.a2_run_id }}
          IN_ATTEMPT: ${{ inputs.a2_run_attempt }}
          IN_CANDIDATE: ${{ inputs.candidate_sha }}
          IN_BASE: ${{ inputs.base_sha }}
          IN_ARTIFACT_ID: ${{ inputs.a2_artifact_id }}
          IN_ARTIFACT_DIGEST: ${{ inputs.a2_artifact_digest }}
        run: |
          node scripts/release/release.mjs admit \
            --version "$IN_VERSION" --integration "$IN_INTEGRATION" \
            --pr "$IN_PR" --run "$IN_RUN" --attempt "$IN_ATTEMPT" \
            --candidate "$IN_CANDIDATE" --base "$IN_BASE" \
            --artifact-id "$IN_ARTIFACT_ID" --artifact-digest "$IN_ARTIFACT_DIGEST" \
            --out "$RELEASE_EVIDENCE"

      - name: Admission summary
        if: ${{ always() }}
        run: |
          {
            echo "### Release admission"
            echo ""
            echo '```json'
            cat "$RELEASE_EVIDENCE/admission.json" 2>/dev/null || echo '{"ok": false, "errors": ["no admission record"]}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-admission
          path: |
            ${{ env.RELEASE_EVIDENCE }}/*.json
            ${{ env.RELEASE_EVIDENCE }}/*.zip
          if-no-files-found: warn
          overwrite: true

  tags:
    name: Create the three annotated tags
    needs: admit
    if: ${{ inputs.stage == 'tag' || inputs.stage == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download admission evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence-admission
          path: ${{ env.RELEASE_EVIDENCE }}

      # Same SHA → kept (resume); another SHA → refused; state re-read before each write.
      - name: Create tags with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
        run: node scripts/release/release.mjs tag --version "$IN_VERSION" --evidence "$RELEASE_EVIDENCE" --via api

  draft-releases:
    name: Create draft releases
    needs: [admit, tags]
    if: ${{ inputs.stage == 'tag' || inputs.stage == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download admission evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence-admission
          path: ${{ env.RELEASE_EVIDENCE }}

      - name: Create or check one draft per tag
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
        run: node scripts/release/release.mjs releases --version "$IN_VERSION" --evidence "$RELEASE_EVIDENCE"

  publish:
    name: Dispatch publish workflows in order
    needs: [admit, tags, draft-releases]
    if: ${{ inputs.stage == 'publish' }}
    runs-on: ubuntu-latest
    # Three publish runs (30 min cap each) plus registry readback.
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download admission evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence-admission
          path: ${{ env.RELEASE_EVIDENCE }}

      # history-server → zudo-doc → create-zudo-doc; each confirmed on npm before the next.
      - name: Publish via explicit workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
        run: node scripts/release/release.mjs publish --version "$IN_VERSION" --evidence "$RELEASE_EVIDENCE" --initiation dispatch --run-timeout 2400

      - name: Upload publication record
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-publication
          path: ${{ env.RELEASE_EVIDENCE }}/publication.json
          if-no-files-found: warn
          overwrite: true

  finalize:
    name: Publish GitHub Releases and read back
    needs: [admit, tags, draft-releases, publish]
    if: ${{ inputs.stage == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Read-only: the readback lists the publish runs.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download admission evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence-admission
          path: ${{ env.RELEASE_EVIDENCE }}

      - name: Download publication record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence-publication
          path: ${{ env.RELEASE_EVIDENCE }}

      - name: Publish the three drafts after npm verification
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
        run: node scripts/release/release.mjs finalize-releases --version "$IN_VERSION" --evidence "$RELEASE_EVIDENCE"

      - name: Read back
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_INTEGRATION: ${{ inputs.integration_sha }}
        run: node scripts/release/release.mjs status --version "$IN_VERSION" --integration "$IN_INTEGRATION" | tee -a "$GITHUB_STEP_SUMMARY"

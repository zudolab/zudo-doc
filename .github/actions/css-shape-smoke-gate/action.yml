name: CSS-shape smoke gate
description: >
  Defends against #1395 (Sub-4 host-side workaround: @theme reset).
  Fetches the deployed CSS and asserts three structural invariants —
  byte size, @media count, and leaked Tailwind default color tokens —
  without class-name greps that are fragile against minification churn.

inputs:
  deploy-url:
    description: >
      Base URL of the deployed site (no trailing slash).
      e.g. "https://zudo-doc.takazudomodular.com" or a preview alias URL.
    required: true

runs:
  using: composite
  steps:
    - name: CSS-shape smoke gate (#1395)
      shell: bash
      env:
        DEPLOY_URL: ${{ inputs.deploy-url }}
      run: |
        bash "${{ github.action_path }}/run.sh"

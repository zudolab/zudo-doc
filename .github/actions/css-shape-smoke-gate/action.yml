name: CSS-shape smoke gate
description: >
  Checks coherent deployed CSS against measured native Wind output: byte size,
  media-rule coverage, owned reset/token layers and responsive package utilities.
  Rejects retired Tailwind directives and known unsupported palette utilities.

inputs:
  deploy-url:
    description: >
      Base URL of the deployed site (no trailing slash).
      e.g. "https://zudo-doc.takazudomodular.com" or a preview alias URL.
    required: true

runs:
  using: composite
  steps:
    - name: CSS-shape smoke gate (#1395)
      shell: bash
      env:
        DEPLOY_URL: ${{ inputs.deploy-url }}
      run: |
        bash "${{ github.action_path }}/run.sh"

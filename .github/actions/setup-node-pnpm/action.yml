name: Setup Node.js and pnpm (cache restore)
description: >
  Sets up pnpm and Node.js, then restores the pnpm store cache. Restore-only:
  composite actions have no `post:` step, so a save here would run before
  `pnpm install` and persist an empty store — see zudolab/zudo-doc#4156 (epic)
  and #4157. The matching save step lives on a single ref-guarded job in
  main-deploy.yml (zudolab/zudo-doc#4161).

inputs:
  dest:
    description: >
      pnpm installation directory, forwarded to pnpm/action-setup's `dest`
      input. Callers pass a per-job path built from the github.job context so
      each job's pnpm install stays isolated (that context resolves correctly
      at the CALL SITE and is passed in here as a plain string).

      Do NOT write a literal expression in this description: GitHub evaluates
      "${" "{ ... }}" templates inside an action manifest's input metadata too,
      where the `github` context does not exist, and the whole manifest then
      fails to load with "Unrecognized named-value: 'github'".
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        dest: ${{ inputs.dest }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        # setup-node's built-in package-manager cache is scoped per ref
        # (refs/pull/N/merge for PRs), so every PR branch wrote its own
        # unreachable ~180 MB entry (zudolab/zudo-doc#4155, epic #4156
        # Correction 1). Disabled here in favor of the explicit restore below.
        package-manager-cache: false

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        # Mandatory, not optional: saves are gated to refs/heads/main (see
        # zudolab/zudo-doc#4156, "the cache design decision"), so any PR that
        # edits pnpm-lock.yaml misses the exact key until it merges. This
        # prefix fallback is what keeps that from being a full cold install.
        restore-keys: |
          node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-

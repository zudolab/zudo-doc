name = "zudo-doc-search"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Optional (non-breaking): `wrangler secret put IP_HASH_SECRET` salts the per-IP
# rate-limit hash with HMAC-SHA-256 (#2038). Absent → unsalted SHA-256 as before.

[vars]
DOCS_SITE_URL = "https://zudo-doc.takazudomodular.com"
RATE_LIMIT_PER_MINUTE = "60"
RATE_LIMIT_PER_DAY = "1000"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "placeholder-create-via-wrangler-kv-namespace-create"
